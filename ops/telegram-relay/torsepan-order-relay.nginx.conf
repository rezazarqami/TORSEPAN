# Include alongside the existing torsepan-relay snippet in the HTTPS server.
location = /torsepan-relay/order-reminder {
    client_max_body_size 16k;
    proxy_read_timeout 30s;
    proxy_pass http://127.0.0.1:5052/order-reminder;
}
location = /torsepan-relay/order-reminder/health {
    proxy_pass http://127.0.0.1:5052/health;
}
