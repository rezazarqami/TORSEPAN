# Include in the existing HTTPS server block for marketsignalist.ir.
# The trailing slash preserves the relay's /database-backup and /inventory-alert routes.
location /torsepan-relay/ {
    client_max_body_size 49m;
    proxy_read_timeout 360s;
    proxy_send_timeout 360s;
    proxy_pass http://127.0.0.1:5051/;
}
