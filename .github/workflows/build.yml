name: Build deployment images

on:
  push:
    branches: [master]
  pull_request:

jobs:
  pdf-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Render report PDF previews
        env:
          TORSEPAN_PDF_PREVIEW_DIR: ${{ runner.temp }}/pdf-previews
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: report-pdf-previews
          path: ${{ runner.temp }}/pdf-previews/*.pdf
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: panel
            dockerfile: Dockerfile.panel
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }}
        run: docker build --file "${{ matrix.dockerfile }}" --tag "torsepan-${{ matrix.name }}:check" .
