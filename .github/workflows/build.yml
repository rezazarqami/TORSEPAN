name: Build deployment images

on:
  push:
    branches: [master]
  pull_request:

jobs:
  export-release-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify export endpoints, shipment transaction, account roles and backup retries
        run: dotnet run --project tests/ReleaseExportSmoke/ReleaseExportSmoke.csproj -c Release
      - name: Verify complete photo backups and passport PDF archive
        run: dotnet run --project tests/ReleaseExportSmoke/ReleaseExportSmoke.csproj -c Release -- --manual-backup-only
      - name: Verify Telegram backup relay errors and acknowledgements
        run: python3 -m unittest discover -s ops/telegram-relay -p test_backup_relay.py
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: panel
            dockerfile: Dockerfile.panel
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }}
        run: docker build --file "${{ matrix.dockerfile }}" --tag "torsepan-${{ matrix.name }}:check" .
