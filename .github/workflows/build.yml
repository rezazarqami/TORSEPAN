name: Build deployment images

on:
  push:
    branches: [master]
  pull_request:

jobs:
  startup-screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify branded Loading screen stays until the initial page is ready
        run: node tests/startup-splash.cjs
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: panel
            dockerfile: Dockerfile.panel
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }}
        run: docker build --file "${{ matrix.dockerfile }}" --tag "torsepan-${{ matrix.name }}:check" .
