name: Build deployment images

on:
  push:
    branches: [master]
  pull_request:

jobs:
  production-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify production tabs, mobile markup and empty-result filters
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --production-ui-only
  production-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify production deletion confirmation and error feedback
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --production-delete-only
  scales-payroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify scale rename propagation and confirmed payroll exclusions
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --scales-payroll-only
  warranty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify automatic sale warranties and sold-only backfill
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --warranty-only
  pdf-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Render report PDF previews
        env:
          TORSEPAN_PDF_PREVIEW_DIR: ${{ runner.temp }}/pdf-previews
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --pdf-preview-only
      - uses: actions/upload-artifact@v4
        with:
          name: report-pdf-previews
          path: ${{ runner.temp }}/pdf-previews/*.pdf
  telegram-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify alert delivery and failure status
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --telegram-alert-only
  orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify orders, access roles, production tracking and reminder retries
        env:
          TORSEPAN_ORDER_PREVIEW_DIR: ${{ runner.temp }}/order-previews
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --orders-only
      - name: Verify authenticated relay and durable receipts
        run: python3 ops/telegram-relay/test_order_reminder_relay.py
      - uses: actions/upload-artifact@v4
        with:
          name: order-previews
          path: ${{ runner.temp }}/order-previews
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: panel
            dockerfile: Dockerfile.panel
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }}
        run: docker build --file "${{ matrix.dockerfile }}" --tag "torsepan-${{ matrix.name }}:check" .
