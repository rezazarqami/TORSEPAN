name: Build deployment images

on:
  push:
    branches: [master]
  pull_request:

jobs:
  export-startup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify export routing, atomic shipping and current account roles
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --export-workflow-only
      - name: Verify compact bowl code sequencing and case-insensitive lookups
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --bowl-code-only
      - name: Verify role policies
        run: dotnet run --project tests/AccessSmoke/AccessSmoke.csproj -c Release
      - name: Verify dated work plans, exceptions, reports and access
        run: dotnet run --project tests/WorkPlansSmoke/WorkPlansSmoke.csproj -c Release
      - name: Verify startup splash handoff
        run: node tests/startup-splash.cjs
      - name: Verify backup relay acknowledgements and failures
        run: python3 -m unittest discover -s ops/telegram-relay -p test_backup_relay.py
  production-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify lookup caching, live inventory and mutation invalidation
        run: dotnet run --project tests/PerformanceSmoke/PerformanceSmoke.csproj -c Release
      - name: Verify production tabs, mobile markup and empty-result filters
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --production-ui-only
      - name: Verify operation confirmation and immediate same-code lookup
        run: dotnet run --project tests/PassportUiSmoke/PassportUiSmoke.csproj -c Release
  production-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify production deletion confirmation and error feedback
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --production-delete-only
  scales-payroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify scale rename propagation and confirmed payroll exclusions
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --scales-payroll-only
      - name: Verify unified scale catalog, shaping requirements and historical references
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --unified-scales-only
      - name: Verify manual top-bowl scale review and unknown bottom counts
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --remaining-scales-only
      - name: Verify base scale families, derived instrument notes and historical payroll tiers
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --scale-family-only
      - name: Verify offline scale projection
        run: node android/tests-offline.cjs
  warranty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify automatic sale warranties and sold-only backfill
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --warranty-only
  pdf-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Render report PDF previews
        env:
          TORSEPAN_PDF_PREVIEW_DIR: ${{ runner.temp }}/pdf-previews
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --pdf-preview-only
      - name: Verify full backup access, archive completeness and passport pagination
        env:
          TORSEPAN_BACKUP_PREVIEW: ${{ runner.temp }}/pdf-previews/passport-backup-preview.pdf
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --manual-backup-only
      - uses: actions/upload-artifact@v4
        with:
          name: report-pdf-previews
          path: ${{ runner.temp }}/pdf-previews/*.pdf
  telegram-alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify alert delivery and failure status
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --telegram-alert-only
  orders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify orders, access roles, production tracking and reminder retries
        env:
          TORSEPAN_ORDER_PREVIEW_DIR: ${{ runner.temp }}/order-previews
        run: dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --orders-only
      - name: Verify authenticated relay and durable receipts
        run: python3 ops/telegram-relay/test_order_reminder_relay.py
      - uses: actions/upload-artifact@v4
        with:
          name: order-previews
          path: ${{ runner.temp }}/order-previews
  offline-production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify offline production, atomic receipts and concurrency protection
        run: |
          TORSEPAN_OFFLINE_REPORT_FIXTURE_DIR="$RUNNER_TEMP/offline-reports" dotnet run --project tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Release -- --offline-only
          node tests/SharedOffline/report-parity.cjs "$RUNNER_TEMP/offline-reports/parity.json"
          dotnet build tests/WorkspaceSmoke/WorkspaceSmoke.csproj -c Debug
          node tests/SharedOffline/sync-e2e.cjs
  docker:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: api
            dockerfile: Dockerfile.api
          - name: panel
            dockerfile: Dockerfile.panel
          - name: unified
            dockerfile: Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.name }}
        run: docker build --build-arg TORSEPAN_NUGET_SOURCE=https://api.nuget.org/v3/index.json --file "${{ matrix.dockerfile }}" --tag "torsepan-${{ matrix.name }}:check" .
