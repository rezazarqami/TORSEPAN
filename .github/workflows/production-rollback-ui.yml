name: Production rollback UI
on:
  push:
    branches: [master, deploy-panel]
    paths: ['TORSEPAN.Panel/**', 'tests/ProductionRollbackUiSmoke/**', '.github/workflows/production-rollback-ui.yml']
  pull_request:
    paths: ['TORSEPAN.Panel/**', 'tests/ProductionRollbackUiSmoke/**', '.github/workflows/production-rollback-ui.yml']
jobs:
  production-rollback-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/ProductionRollbackUiSmoke/ProductionRollbackUiSmoke.csproj -c Release
