name: Build Torsepan Android APK

on:
  push:
    paths: ["TORSEPAN.Panel/**", "TORSEPAN.Panel.Offline/**", "TORSEPAN.Application/**", "TORSEPAN.Domain/**", "ops/build-shared-offline.sh", "tests/SharedOffline/**", "android/**", ".github/workflows/build-android.yml"]
  pull_request:
    paths: ["TORSEPAN.Panel/**", "TORSEPAN.Panel.Offline/**", "TORSEPAN.Application/**", "TORSEPAN.Domain/**", "ops/build-shared-offline.sh", "tests/SharedOffline/**", "android/**", ".github/workflows/build-android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install local UI test dependencies
        run: npm ci --prefix tests/OfflineUi
      - name: Verify local offline page and form state
        run: npm test --prefix tests/OfflineUi
      - name: Verify native-only offline menu access
        run: |
          npm install --prefix "$RUNNER_TEMP/offline-tools" playwright@1.56.1
          node "$RUNNER_TEMP/offline-tools/node_modules/playwright/cli.js" install --with-deps chromium
          THEME_PLAYWRIGHT="$RUNNER_TEMP/offline-tools/node_modules/playwright" node tests/offline-menu.cjs
      - name: Verify offline projection
        run: node android/tests-offline.cjs
      - name: Verify native transport refresh and acknowledgment contracts
        run: |
          curl -fsSL https://repo.maven.apache.org/maven2/org/json/json/20240303/json-20240303.jar -o "$RUNNER_TEMP/torsepan-json.jar"
          TORSEPAN_JSON_JAR="$RUNNER_TEMP/torsepan-json.jar" tests/NativeSyncTransport/run.sh
      - name: Verify durable native outbox and lost-response retry
        working-directory: android
        run: gradle :app:testDebugUnitTest --no-daemon
      - name: Verify shared offline form contracts
        run: |
          node --test tests/SharedOffline/adapter.cjs
          node tests/SharedOffline/performance.cjs
      - name: Package shared workshop interface
        run: ops/build-shared-offline.sh
      - name: Verify bundled shared assets
        run: node tests/SharedOffline/package.cjs
      - name: Verify packaged shared pages and offline tune
        run: TORSEPAN_PLAYWRIGHT="$RUNNER_TEMP/offline-tools/node_modules/playwright" node tests/SharedOffline/browser.cjs
      - name: Build installable APK
        working-directory: android
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: torsepan-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
