# Production deployment is owned by Liara's GitHub integration.
# Intentionally no automatic trigger and no executable deployment job.
name: Selective Liara release
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deployment is managed by Liara automatic GitHub integration."
