name: Navy theme preview
on:
  pull_request:
    paths:
      - 'TORSEPAN.Panel/**'
      - 'tests/theme-*'
      - 'tests/connection-*'
      - '.github/workflows/navy-theme-preview.yml'
  workflow_dispatch:
jobs:
  browser-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify background connection recovery state machine
        run: node tests/connection-recovery.cjs
      - name: Build actual panel
        run: dotnet build TORSEPAN.Panel -c Release -m:1 --nologo
      - name: Install browser tools outside repository
        run: |
          npm install --prefix "$RUNNER_TEMP/theme-tools" playwright@1.56.1
          node "$RUNNER_TEMP/theme-tools/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Verify isolated interactive preview at phone, tablet and desktop sizes
        run: |
          export THEME_PLAYWRIGHT="$RUNNER_TEMP/theme-tools/node_modules/playwright"
          export THEME_SCREENSHOTS="$RUNNER_TEMP/theme-screenshots"
          THEME_BROWSER_SCRIPTS="tests/theme-browser.cjs tests/theme-all-pages.cjs tests/theme-scrollbar.cjs tests/theme-header-scroll.cjs tests/connection-browser.cjs" bash tests/theme-preview.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: navy-theme-mobile-previews
          path: |
            ${{ runner.temp }}/theme-screenshots
            /tmp/torsepan-theme-panel.log
            /tmp/torsepan-theme-fixture.log
