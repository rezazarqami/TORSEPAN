name: Build iOS
on:
  push:
    branches: [master]
    paths: ['ios/**', '.github/workflows/build-ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/build-ios.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
      - name: Test on iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for ds in json.load(sys.stdin)["devices"].values() for d in ds if "iPhone" in d["name"]))')
          xcodebuild test -project ios/Torsepan.xcodeproj -scheme Torsepan -destination "platform=iOS Simulator,id=$DEVICE_ID" -resultBundlePath build/iOS-tests CODE_SIGNING_ALLOWED=NO
      - name: Verify device compilation (unsigned; not an installable release)
        run: xcodebuild build -project ios/Torsepan.xcodeproj -scheme Torsepan -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-test-results
          path: build/iOS-tests.xcresult
